<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard - MCP Experiment 2</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }
        h1 { font-size: 36px; margin-bottom: 10px; }
        .subtitle { opacity: 0.9; font-size: 16px; }
        .search-box {
            background: white;
            border-radius: 50px;
            padding: 8px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            display: flex;
            margin-bottom: 30px;
        }
        #location {
            flex: 1;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            outline: none;
        }
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }
        button:hover { transform: scale(1.05); }
        .weather-card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
            display: none;
        }
        .weather-card.show { display: block; }
        .location-name {
            font-size: 32px;
            font-weight: bold;
            color: #333;
            margin-bottom: 20px;
        }
        .temperature {
            font-size: 72px;
            font-weight: bold;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 20px 0;
        }
        .condition {
            font-size: 24px;
            color: #666;
            margin-bottom: 30px;
        }
        .details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 30px;
        }
        .detail-item {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 12px;
        }
        .detail-label {
            font-size: 12px;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }
        .detail-value {
            font-size: 24px;
            font-weight: bold;
            color: #333;
        }
        .loading {
            text-align: center;
            color: white;
            font-size: 18px;
            margin: 40px 0;
            display: none;
        }
        .loading.show { display: block; }
        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            display: none;
            margin-bottom: 20px;
        }
        .error.show { display: block; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🌤️ Weather Dashboard</h1>
            <p class="subtitle">MCP Experiment 2 - Real-time weather data</p>
        </header>
        
        <div class="search-box">
            <input type="text" id="location" placeholder="Enter city name (e.g., Tokyo, London, Paris)..." onkeypress="if(event.key==='Enter') getWeather()">
            <button onclick="getWeather()">Search</button>
        </div>
        
        <div id="loading" class="loading">Loading weather data...</div>
        <div id="error" class="error"></div>
        
        <div id="weather-card" class="weather-card">
            <div class="location-name" id="locationName"></div>
            <div class="temperature" id="temperature"></div>
            <div class="condition" id="condition"></div>
            
            <div class="details">
                <div class="detail-item">
                    <div class="detail-label">Feels Like</div>
                    <div class="detail-value" id="feelsLike"></div>
                </div>
                <div class="detail-item">
                    <div class="detail-label">Humidity</div>
                    <div class="detail-value" id="humidity"></div>
                </div>
                <div class="detail-item">
                    <div class="detail-label">Wind Speed</div>
                    <div class="detail-value" id="wind"></div>
                </div>
                <div class="detail-item">
                    <div class="detail-label">Status</div>
                    <div class="detail-value">🌍 Live</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function getWeather() {
            const location = document.getElementById('location').value.trim();
            
            if (!location) {
                showError('Please enter a city name');
                return;
            }
            
            const loading = document.getElementById('loading');
            const weatherCard = document.getElementById('weather-card');
            const errorDiv = document.getElementById('error');
            
            // Show loading
            loading.classList.add('show');
            weatherCard.classList.remove('show');
            errorDiv.classList.remove('show');
            
            try {
                const response = await fetch(`/api/experiment-2/weather?location=${encodeURIComponent(location)}`);
                const data = await response.json();
                
                loading.classList.remove('show');
                
                if (data.success) {
                    // Display weather data
                    document.getElementById('locationName').textContent = data.location;
                    document.getElementById('temperature').textContent = data.temperature;
                    document.getElementById('condition').textContent = data.condition;
                    document.getElementById('feelsLike').textContent = data.feels_like;
                    document.getElementById('humidity').textContent = data.humidity;
                    document.getElementById('wind').textContent = data.wind;
                    
                    weatherCard.classList.add('show');
                } else {
                    showError(data.error || 'Failed to fetch weather data');
                }
            } catch (error) {
                loading.classList.remove('show');
                showError('Error connecting to weather service');
            }
        }
        
        function showError(message) {
            const errorDiv = document.getElementById('error');
            errorDiv.textContent = message;
            errorDiv.classList.add('show');
            setTimeout(() => errorDiv.classList.remove('show'), 5000);
        }
        
        // Load default city on page load
        window.onload = () => {
            document.getElementById('location').value = 'Tokyo';
            getWeather();
        };
    </script>
</body>
</html>
